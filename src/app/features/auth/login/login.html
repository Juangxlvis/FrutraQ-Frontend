<div class="login-container">
  @if (loginOk()) {
    <mat-card class="login-card">
      <mat-card-content>
        <p>✅ Sesión iniciada correctamente. El token JWT quedó guardado.</p>
        <p><small>Pantalla temporal — el paso 4 la reemplaza por el módulo de Viajes.</small></p>
      </mat-card-content>
    </mat-card>
  } @else {
    <mat-card class="login-card">
      <mat-card-header>
        <mat-card-title>FrutraQ</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Usuario</mat-label>
            <input matInput formControlName="username" autocomplete="username" />
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Contraseña</mat-label>
            <input matInput type="password" formControlName="password" autocomplete="current-password" />
          </mat-form-field>

          @if (errorMessage()) {
            <p class="error">{{ errorMessage() }}</p>
          }

          <button mat-raised-button color="primary" type="submit"
                  [disabled]="form.invalid || loading()" class="full-width">
            @if (loading()) {
              <mat-spinner diameter="20"></mat-spinner>
            } @else {
              Ingresar
            }
          </button>
        </form>
      </mat-card-content>
    </mat-card>
  }
</div>
